<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fizik Ders Takip</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin:0; background:#eef1f7; color:#1f2937; font-size:16px;
    touch-action: manipulation; overscroll-behavior-y: none;
    overflow-x: hidden;            /* yatay taşma/kesik tamamen kapalı */
  }

  /* ===== Başlık çubuğu ===== */
  header {
    background:#1e3a8a; color:#fff;
    padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top));
    position:sticky; top:0; z-index:5;
  }
  .hrow1 { display:flex; align-items:center; gap:8px; }
  .hrow1 h1 { font-size:17px; margin:0; flex:1 1 auto; min-width:0;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hrow2 { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
  .hrow2 .sub { font-size:14px; opacity:.92; flex:1 1 auto; min-width:0;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #backBtn, #manageBtn {
    background:rgba(255,255,255,.18); border:0; color:#fff; font-size:15px;
    padding:10px 14px; border-radius:10px; cursor:pointer; min-height:48px;
    display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  }
  #backBtn { display:none; }
  #backBtn:active, #manageBtn:active { transform:scale(.96); background:rgba(255,255,255,.28); }

  /* ===== İnternet şeridi ===== */
  #netBanner { display:none; align-items:center; justify-content:space-between; gap:8px;
               margin-top:8px; padding:11px 12px; border-radius:10px; font-size:15px; line-height:1.4; }
  #netBanner.err { background:#fee2e2; color:#7f1d1d; border:1px solid #dc2626; }
  #netBanner.ok  { background:#dcfce7; color:#14532d; border:1px solid #16a34a; }
  #netRetry { background:#7f1d1d; color:#fff; border:0; border-radius:9px;
              padding:9px 16px; font-size:15px; cursor:pointer; white-space:nowrap; min-height:44px; }
  #netRetry:active { transform:scale(.96); }

  main { padding:14px; max-width:820px; margin:0 auto; }
  #status { padding:13px 14px; border-radius:12px; background:#fff; border:1px solid #e5e7eb;
            margin-bottom:14px; font-size:16px; line-height:1.45; }
  #status.ok { border-color:#bbf7d0; background:#f0fdf4; }
  #status.err { border-color:#fecaca; background:#fef2f2; color:#991b1b; }

  /* ===== Izgara: telefonda 2 sütun (isimler büyük), yukarı doğru artar ===== */
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  @media (min-width:600px){ .grid { grid-template-columns:repeat(3, 1fr); } }
  @media (min-width:820px){ .grid { grid-template-columns:repeat(4, 1fr); } }
  @media (min-width:1024px){ .grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); } }
  .card {
    background:#fff; border:1px solid #e5e7eb; border-radius:14px;
    padding:14px 8px; text-align:center; cursor:pointer; transition:.12s;
    min-height:90px; display:flex; flex-direction:column; justify-content:center;
  }
  .card:active { transform:scale(.96); }
  .card .name { font-weight:600; font-size:15px; line-height:1.25;
                overflow-wrap:anywhere; word-break:break-word; }
  .card .meta { font-size:13px; color:#6b7280; margin-top:6px; }
  .sube { font-size:20px; font-weight:700; }
  @media (min-width:600px){ .sube { font-size:22px; } }

  /* ===== Öğrenci yönetimi ===== */
  .addbtn { width:100%; background:#16a34a; color:#fff; border:0; border-radius:12px;
            padding:16px; font-size:17px; cursor:pointer; margin-bottom:14px; min-height:56px; }
  .addbtn:active { transform:scale(.98); }
  .srow { background:#fff; border:1px solid #e5e7eb; border-radius:12px;
          padding:13px 14px; margin-bottom:10px; display:flex; flex-direction:column; gap:11px; }
  .srow .info { min-width:0; }
  .srow .nm { font-weight:600; font-size:16px; overflow-wrap:anywhere; }
  .srow .mt { font-size:14px; color:#6b7280; margin-top:3px; }
  .actions { display:flex; gap:10px; }
  .actions .iconbtn { flex:1; }
  .iconbtn { background:#fff; border:1px solid #d1d5db; border-radius:10px;
             padding:12px 14px; font-size:15px; cursor:pointer; white-space:nowrap; min-height:48px; }
  .iconbtn:active { transform:scale(.96); }
  .iconbtn.danger { background:#dc2626; color:#fff; border-color:#dc2626; }
  @media (min-width:600px){
    .srow { flex-direction:row; align-items:center; }
    .srow .info { flex:1; }
    .actions { flex:0 0 auto; }
    .actions .iconbtn { flex:0 0 auto; }
  }

  /* ===== Alt panel: not ===== */
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; }
  #sheet {
    display:none; position:fixed; left:0; right:0; bottom:0;
    height:92vh; height:92dvh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    background:#fff; border-radius:22px 22px 0 0; z-index:11;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 26px rgba(0,0,0,.2);
  }
  .grabber { width:48px; height:6px; border-radius:99px; background:#d1d5db; margin:0 auto 14px; }
  #sheet h2 { margin:0 0 3px; font-size:21px; line-height:1.25; overflow-wrap:anywhere; }
  #sheet .who { font-size:14px; color:#6b7280; margin-bottom:12px; }
  .modeRow { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .modebadge { font-size:14px; padding:6px 14px; border-radius:999px; background:#e0e7ff; color:#312e81; font-weight:600; }
  .modebadge.edit { background:#fef3c7; color:#92400e; }
  .linkbtn { background:none; border:0; color:#1e3a8a; font-size:15px; cursor:pointer; text-decoration:underline; padding:8px 4px; }

  /* Çipler: telefonda 2 sütunlu büyük kutular -> zoom gerekmez, taşma olmaz */
  .chips { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:16px; }
  @media (min-width:600px){ .chips { grid-template-columns:repeat(3, 1fr); } }
  @media (min-width:900px){ .chips { grid-template-columns:repeat(4, 1fr); } }
  .chip { border:1px solid #d1d5db; background:#f9fafb; border-radius:12px;
          padding:12px 8px; font-size:16px; cursor:pointer; user-select:none; min-height:54px;
          display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2; }
  .chip:active { transform:scale(.96); }
  .chip.pos.on { background:#dcfce7; border-color:#16a34a; color:#14532d; }
  .chip.neg.on { background:#fee2e2; border-color:#dc2626; color:#7f1d1d; }
  .chip.neu.on { background:#e0e7ff; border-color:#4f46e5; color:#312e81; }

  textarea { width:100%; min-height:96px; border:1px solid #d1d5db; border-radius:12px;
             padding:14px; font:inherit; font-size:18px; resize:vertical; }
  .row { display:flex; gap:12px; margin-top:16px; }
  .btn { flex:1; border:0; border-radius:12px; padding:16px; font-size:17px; cursor:pointer; min-height:58px; }
  .btn:active { transform:scale(.98); }
  .btn.save { background:#1e3a8a; color:#fff; }
  .btn.cancel { background:#e5e7eb; color:#374151; }

  .hist { margin-top:18px; border-top:1px dashed #e5e7eb; padding-top:14px; }
  .hist h3 { font-size:15px; color:#6b7280; margin:0 0 12px; }
  .hitem { background:#f9fafb; border:1px solid #eee; border-radius:12px;
           padding:13px 14px; margin-bottom:10px; font-size:15px; line-height:1.4;
           display:flex; flex-direction:column; gap:11px; }
  .hitem .body { min-width:0; }
  .hitem .d { color:#6b7280; font-size:13px; }
  .hitem .t { display:inline-block; margin:4px 6px 0 0; padding:4px 12px; border-radius:999px; font-size:13px; }
  .t.pos{background:#dcfce7;color:#14532d;} .t.neg{background:#fee2e2;color:#7f1d1d;} .t.neu{background:#e0e7ff;color:#312e81;}
  @media (min-width:600px){
    .hitem { flex-direction:row; align-items:flex-start; }
    .hitem .body { flex:1; }
  }

  /* ===== Form paneli (öğrenci ekle/düzenle) ===== */
  #formOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:12; }
  #formSheet {
    display:none; position:fixed; left:0; right:0; bottom:0;
    max-height:92vh; max-height:92dvh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    background:#fff; border-radius:22px 22px 0 0; z-index:13;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 26px rgba(0,0,0,.2);
  }
  #formSheet h2 { margin:0 0 6px; font-size:21px; }
  #formSheet .fcls { font-size:15px; color:#6b7280; margin-bottom:6px; }
  .fgroup label { font-size:14px; color:#6b7280; display:block; margin:14px 0 6px; }
  .fgroup input { width:100%; border:1px solid #d1d5db; border-radius:11px;
                  padding:14px; font:inherit; font-size:18px; min-height:54px; }
  /* Telefonda Sıra/Okul No alt alta (geniş ve kolay), tablette/PC'de yan yana */
  .frow2 { display:flex; flex-direction:column; }
  @media (min-width:600px){
    .frow2 { flex-direction:row; gap:12px; }
    .frow2 .fgroup { flex:1; }
  }

  #toast { position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom));
           transform:translateX(-50%); background:#111827; color:#fff;
           padding:13px 20px; border-radius:12px; font-size:15px; opacity:0;
           transition:.25s; z-index:30; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="hrow1">
    <button id="backBtn">← Geri</button>
    <h1>Fizik Ders Takip</h1>
  </div>
  <div class="hrow2">
    <span class="sub" id="hdrSub">Şube seçiniz</span>
    <button id="manageBtn">👥 Öğrenciler</button>
  </div>
  <div id="netBanner">
    <span id="netMsg"></span>
    <button id="netRetry">Tekrar Dene</button>
  </div>
</header>

<main>
  <div id="status">Hazırlanıyor…</div>
  <div id="content"></div>
</main>

<!-- Not paneli -->
<div id="overlay"></div>
<div id="sheet">
  <div class="grabber"></div>
  <h2 id="mName"></h2>
  <div class="who" id="mWho"></div>
  <div class="modeRow">
    <span class="modebadge" id="mMode">Yeni not</span>
    <button id="mNewBtn" class="linkbtn" style="display:none">+ Yeni not ekle</button>
  </div>
  <div class="chips" id="mChips"></div>
  <textarea id="mDetail" placeholder="İsteğe bağlı detay notu…"></textarea>
  <div class="row">
    <button class="btn cancel" id="mCancel">Kapat</button>
    <button class="btn save" id="mSave">Notu Kaydet</button>
  </div>
  <div class="hist"><h3>Geçmiş notlar</h3><div id="mHist"></div></div>
</div>

<!-- Öğrenci formu -->
<div id="formOverlay"></div>
<div id="formSheet">
  <div class="grabber"></div>
  <h2 id="fTitle">Yeni Öğrenci</h2>
  <div class="fcls" id="fCls"></div>
  <div class="frow2">
    <div class="fgroup"><label>Sıra No</label><input id="fSeat" type="number" inputmode="numeric" placeholder="Örn: 1" /></div>
    <div class="fgroup"><label>Okul No</label><input id="fNum" type="number" inputmode="numeric" placeholder="Örn: 578" /></div>
  </div>
  <div class="fgroup"><label>Ad Soyad</label><input id="fName" type="text" placeholder="Örn: AYŞE YILMAZ" /></div>
  <div class="row">
    <button class="btn cancel" id="fCancel">Vazgeç</button>
    <button class="btn save" id="fSave">Kaydet</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ===== Supabase bağlantısı (anon anahtar publicly tasarlanmıştır) ===== */
const SUPABASE_URL = "https://hxrshhnvaknauhgqrlkb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cnNoaG52YWtuYXVoZ3FybGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTM1NzEsImV4cCI6MjEwNjI4OTU3MX0.wnjhb3w9N_J35EL9MLQRXq3V3KsRQ_p3MmjqfgH3HAs";
const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TAGS = [
  {label:"Çok Başarılı", type:"pos"},
  {label:"Çok İstekli", type:"pos"},
  {label:"Dikkatli", type:"pos"},
  {label:"Katılımcı", type:"pos"},
  {label:"Dinlemiyor", type:"neg"},
  {label:"Ödevini Yapmamış", type:"neg"},
  {label:"Not Almıyor", type:"neg"},
  {label:"Dikkat Dağınık", type:"neg"},
  {label:"Derse Girmedi", type:"neg"},
  {label:"Derse Geç Geldi", type:"neg"},
  {label:"Pasif", type:"neu"}
];

/* ===== DOM ===== */
const $ = (id) => document.getElementById(id);
const statusEl=$("status"), contentEl=$("content"), hdrSub=$("hdrSub");
const overlay=$("overlay"), sheet=$("sheet"), backBtn=$("backBtn"), manageBtn=$("manageBtn");
const formOverlay=$("formOverlay"), formSheet=$("formSheet");

/* ===== State ===== */
let viewMode = "track";
let currentClass = null;
let manageClass = null;
let currentStudent = null;
let selectedTags = new Set();
let editingId = null;
let editingStudentId = null;

function setStatus(msg, kind){ statusEl.textContent = msg; statusEl.className = kind || ""; }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1900); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtDate(d){ try{ return new Date(d).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"});}catch(_){return d;} }

/* ===== İnternet kontrolü yardımcıları ===== */
function isNetworkError(e){
  const m = (e && e.message) ? String(e.message) : "";
  return (e instanceof TypeError) || /failed to fetch|network|fetch|timeout|enotfound|econnrefused|unreachable/i.test(m);
}
function setNetBanner(state, msg){
  const b = $("netBanner");
  if(state === "hide"){ b.style.display="none"; b.className=""; return; }
  b.style.display = "flex";
  b.className = state;
  $("netMsg").textContent = msg || (state==="err" ? "İnternet bağlantısı sorunu." : "Bağlantı kuruldu.");
  $("netRetry").style.display = (state==="err") ? "inline-block" : "none";
  if(state === "ok"){ setTimeout(()=>setNetBanner("hide"), 2500); }
}
function reportReadError(e, fallback){
  if(isNetworkError(e)){ setNetBanner("err", "Sunucuya ulaşılamadı. Bağlantınızı kontrol edip 'Tekrar Dene' butonuna basın."); }
  else { setStatus(fallback || ("Hata: " + (e && e.message ? e.message : e)), "err"); }
}
function reportWriteError(e){
  if(isNetworkError(e)){ setNetBanner("err", "İnternet yok; işlem kaydedilemedi."); toast("İnternet yok, kaydedilemedi."); }
  else { toast("İşlem başarısız: " + (e && e.message ? e.message : e)); }
}

/* ===== Açılış ===== */
async function boot(){
  viewMode="track"; manageClass=null;
  if(!navigator.onLine){
    setNetBanner("err", "İnternet bağlantısı bulunamadı. Bağlantınızı kontrol edip 'Tekrar Dene' butonuna basın.");
    setStatus("Bağlantı bekleniyor…", "");
    return;
  }
  setNetBanner("hide");
  try{
    const { count, error } = await db.from("classes").select("*",{count:"exact",head:true});
    if(error) throw error;
    if(!count){ setStatus("Hiç şube bulunamadı. Supabase > Table Editor > classes üzerinden şube ekleyin.","err"); contentEl.innerHTML=""; return; }
    await loadClasses();
  }catch(e){ reportReadError(e, "Hata: " + (e && e.message ? e.message : e)); }
}

/* ===== Şube listesi (ders takibi) ===== */
async function loadClasses(){
  viewMode="track"; currentClass=null; manageClass=null;
  setNetBanner("hide");
  hdrSub.textContent="Şube seçiniz"; backBtn.style.display="none";
  const { data, error } = await db.from("classes").select("id,name").order("name");
  if(error){ reportReadError(error); return; }
  setStatus(data.length+" şube. Ders takibi için bir şube seçin.","ok");
  contentEl.innerHTML='<div class="grid"></div>';
  const g=contentEl.querySelector(".grid");
  data.forEach(c=>{
    const d=document.createElement("div"); d.className="card sube"; d.textContent=c.name;
    d.onclick=()=>selectClass(c); g.appendChild(d);
  });
}

/* ===== Öğrenci ızgarası (ders takibi) ===== */
async function selectClass(c){
  viewMode="track"; currentClass=c;
  setNetBanner("hide");
  hdrSub.textContent=c.name+" · öğrenciler"; backBtn.style.display="inline-flex";
  setStatus(c.name+" öğrencileri yükleniyor…","");
  const { data, error } = await db.from("students").select("id,seat_number,student_number,full_name")
    .eq("class_id",c.id).order("seat_number",{ascending:true});
  if(error){ reportReadError(error); return; }
  setStatus(data.length+" öğrenci. Not almak için öğrenciye dokunun.","ok");
  contentEl.innerHTML='<div class="grid"></div>';
  const g=contentEl.querySelector(".grid");
  data.forEach(s=>{
    const d=document.createElement("div"); d.className="card";
    d.innerHTML='<div class="name">'+esc(s.full_name)+'</div><div class="meta">Sıra '+(s.seat_number??"-")+' · No '+(s.student_number??"-")+'</div>';
    d.onclick=()=>openSheet(s); g.appendChild(d);
  });
}

/* ===== Öğrenci Yönetimi ===== */
async function openManage(){
  viewMode="manage"; manageClass=null;
  setNetBanner("hide");
  hdrSub.textContent="Öğrenci Yönetimi · şube seçiniz"; backBtn.style.display="inline-flex";
  const { data, error } = await db.from("classes").select("id,name").order("name");
  if(error){ reportReadError(error); return; }
  setStatus("Yönetmek istediğiniz şubeyi seçin.","ok");
  contentEl.innerHTML='<div class="grid"></div>';
  const g=contentEl.querySelector(".grid");
  data.forEach(c=>{
    const d=document.createElement("div"); d.className="card sube"; d.textContent=c.name;
    d.onclick=()=>renderManageStudents(c); g.appendChild(d);
  });
}

async function renderManageStudents(c){
  viewMode="manage"; manageClass=c;
  setNetBanner("hide");
  hdrSub.textContent="Öğrenci Yönetimi · "+c.name; backBtn.style.display="inline-flex";
  setStatus(c.name+" öğrencileri yükleniyor…","");
  const { data, error } = await db.from("students").select("id,seat_number,student_number,full_name")
    .eq("class_id",c.id).order("seat_number",{ascending:true});
  if(error){ reportReadError(error); return; }
  setStatus(data.length+" öğrenci.","ok");
  contentEl.innerHTML="";
  const add=document.createElement("button"); add.className="addbtn"; add.textContent="＋ Yeni Öğrenci Ekle";
  add.onclick=()=>openStudentForm(null); contentEl.appendChild(add);
  const wrap=document.createElement("div"); contentEl.appendChild(wrap);
  if(!data.length){ wrap.innerHTML='<div style="color:#6b7280;font-size:16px;padding:8px">Bu şubede henüz öğrenci yok.</div>'; return; }
  data.forEach(s=>{
    const r=document.createElement("div"); r.className="srow";
    r.innerHTML='<div class="info"><div class="nm">'+esc(s.full_name)+'</div>'+
      '<div class="mt">Sıra '+(s.seat_number??"-")+' · No '+(s.student_number??"-")+'</div></div>'+
      '<div class="actions"><button class="iconbtn ebtn">Düzenle</button><button class="iconbtn dbtn">Sil</button></div>';
    r.querySelector(".ebtn").onclick=()=>openStudentForm(s);
    const dbtn=r.querySelector(".dbtn");
    dbtn.onclick=function(){
      if(this.dataset.confirm==="1"){ deleteStudent(s.id); }
      else{
        this.dataset.confirm="1"; this.textContent="Onayla!"; this.classList.add("danger");
        const self=this;
        setTimeout(()=>{ self.dataset.confirm=""; self.textContent="Sil"; self.classList.remove("danger"); },3000);
      }
    };
    wrap.appendChild(r);
  });
}

/* ===== Öğrenci formu (ekle / düzenle) ===== */
function openStudentForm(s){
  editingStudentId = s ? s.id : null;
  $("fTitle").textContent = s ? "Öğrenci Düzenle" : "Yeni Öğrenci";
  $("fCls").textContent = "Şube: " + (manageClass ? manageClass.name : "-");
  $("fSeat").value = s ? (s.seat_number ?? "") : "";
  $("fNum").value  = s ? (s.student_number ?? "") : "";
  $("fName").value = s ? s.full_name : "";
  formOverlay.style.display="block"; formSheet.style.display="block";
  formSheet.scrollTop=0;
  setTimeout(()=>$("fName").focus(),80);
}
function closeStudentForm(){ formOverlay.style.display="none"; formSheet.style.display="none"; editingStudentId=null; }
formOverlay.onclick=closeStudentForm; $("fCancel").onclick=closeStudentForm;

$("fSave").onclick=async ()=>{
  const name=$("fName").value.trim();
  if(!name){ toast("Ad soyad zorunludur."); return; }
  const seat = $("fSeat").value==="" ? null : parseInt($("fSeat").value,10);
  const num  = $("fNum").value===""  ? null : parseInt($("fNum").value,10);
  const payload = { class_id: manageClass.id, seat_number: seat, student_number: num, full_name: name };
  try{
    if(editingStudentId){
      const { error } = await db.from("students").update(payload).eq("id", editingStudentId);
      if(error) throw error; toast("Öğrenci güncellendi ✓");
    }else{
      const { error } = await db.from("students").insert(payload);
      if(error) throw error; toast("Öğrenci eklendi ✓");
    }
    closeStudentForm();
    renderManageStudents(manageClass);
  }catch(e){ reportWriteError(e); }
};

async function deleteStudent(id){
  try{
    const { error } = await db.from("students").delete().eq("id", id);
    if(error) throw error;
    toast("Öğrenci ve notları silindi ✓");
    renderManageStudents(manageClass);
  }catch(e){ reportWriteError(e); }
}

/* ===== Geri butonu (mod + alt ekran) ===== */
backBtn.onclick=()=>{
  if(viewMode==="manage"){
    if(manageClass) openManage();
    else loadClasses();
  } else {
    loadClasses();
  }
};
manageBtn.onclick=openManage;

/* ===== Not paneli ===== */
function clearSelection(){ selectedTags.clear(); document.querySelectorAll("#mChips .chip").forEach(c=>c.classList.remove("on")); $("mDetail").value=""; }
function setMode(mode){
  if(mode==="edit"){ $("mSave").textContent="Değişiklikleri Güncelle"; $("mMode").textContent="Düzenleniyor"; $("mMode").className="modebadge edit"; $("mNewBtn").style.display="inline-block"; }
  else{ $("mSave").textContent="Notu Kaydet"; $("mMode").textContent="Yeni not"; $("mMode").className="modebadge"; $("mNewBtn").style.display="none"; }
}
function openSheet(s){
  currentStudent=s; editingId=null;
  $("mName").textContent=s.full_name;
  $("mWho").textContent="Sıra "+(s.seat_number??"-")+" · Numara "+(s.student_number??"-")+" · "+(currentClass?currentClass.name:"");
  const cw=$("mChips"); cw.innerHTML="";
  TAGS.forEach(t=>{
    const c=document.createElement("div"); c.className="chip "+t.type; c.textContent=t.label;
    c.onclick=()=>{ if(selectedTags.has(t.label)){selectedTags.delete(t.label);c.classList.remove("on");} else {selectedTags.add(t.label);c.classList.add("on");} };
    cw.appendChild(c);
  });
  clearSelection(); setMode("new"); loadHistory(s.id);
  overlay.style.display="block"; sheet.style.display="block";
  sheet.scrollTop=0;
}
function closeSheet(){ overlay.style.display="none"; sheet.style.display="none"; currentStudent=null; editingId=null; }
overlay.onclick=closeSheet; $("mCancel").onclick=closeSheet;
$("mNewBtn").onclick=()=>{ editingId=null; clearSelection(); setMode("new"); sheet.scrollTop=0; };

function editObservation(o){
  editingId=o.id; selectedTags=new Set(o.tags||[]);
  document.querySelectorAll("#mChips .chip").forEach(c=>c.classList.toggle("on", selectedTags.has(c.textContent)));
  $("mDetail").value=o.note_detail||""; setMode("edit");
  sheet.scrollTo({top:0,behavior:"smooth"});
}
async function deleteObservation(id){
  try{
    const { error } = await db.from("observations").delete().eq("id", id);
    if(error) throw error; toast("Not silindi ✓");
    if(editingId===id){ editingId=null; clearSelection(); setMode("new"); }
    loadHistory(currentStudent.id);
  }catch(e){ reportWriteError(e); }
}
async function loadHistory(id){
  const h=$("mHist"); h.innerHTML="<div style='color:#9ca3af;font-size:14px'>Yükleniyor…</div>";
  const { data, error } = await db.from("observations").select("id,observation_date,tags,note_detail,created_at")
    .eq("student_id",id).order("created_at",{ascending:false}).limit(30);
  if(error){
    if(isNetworkError(error)) setNetBanner("err", "Geçmiş notlar yüklenemedi. Bağlantınızı kontrol edin.");
    h.innerHTML="<div style='color:#991b1b;font-size:14px'>"+esc(error.message)+"</div>"; return;
  }
  if(!data.length){ h.innerHTML="<div style='color:#9ca3af;font-size:14px'>Henüz not yok.</div>"; return; }
  h.innerHTML="";
  data.forEach(o=>{
    const d=document.createElement("div"); d.className="hitem";
    let tagsHtml=(o.tags||[]).map(t=>{ const meta=TAGS.find(x=>x.label===t); const ty=meta?meta.type:"neu"; return '<span class="t '+ty+'">'+esc(t)+'</span>'; }).join("");
    const body='<div class="d">'+fmtDate(o.observation_date)+'</div>'+tagsHtml+(o.note_detail?'<div style="margin-top:6px">'+esc(o.note_detail)+'</div>':"");
    d.innerHTML='<div class="body">'+body+'</div>'+
      '<div class="actions"><button class="iconbtn ebtn">Düzenle</button><button class="iconbtn dbtn">Sil</button></div>';
    d.querySelector(".ebtn").onclick=()=>editObservation(o);
    const dbtn=d.querySelector(".dbtn");
    dbtn.onclick=function(){
      if(this.dataset.confirm==="1"){ deleteObservation(o.id); }
      else{
        this.dataset.confirm="1"; this.textContent="Onayla!"; this.classList.add("danger");
        const self=this;
        setTimeout(()=>{ self.dataset.confirm=""; self.textContent="Sil"; self.classList.remove("danger"); },3000);
      }
    };
    h.appendChild(d);
  });
}
$("mSave").onclick=async ()=>{
  const detail=$("mDetail").value.trim(); const tags=[...selectedTags];
  if(!tags.length && !detail){ toast("Etiket seçin veya not yazın."); return; }
  try{
    if(editingId){
      const { error } = await db.from("observations").update({ tags, note_detail: detail||null }).eq("id", editingId);
      if(error) throw error; toast("Güncellendi ✓"); editingId=null; clearSelection(); setMode("new");
    }else{
      const { error } = await db.from("observations").insert({ student_id: currentStudent.id, tags, note_detail: detail||null });
      if(error) throw error; toast("Not kaydedildi ✓"); clearSelection();
    }
    loadHistory(currentStudent.id);
  }catch(e){ reportWriteError(e); }
};

/* ===== Canlı ağ gözetimi + Tekrar Dene ===== */
$("netRetry").onclick = () => boot();
window.addEventListener("offline", () => setNetBanner("err", "İnternet bağlantısı koptu. Notlar şu an kaydedilemeyecek."));
window.addEventListener("online",  () => { setNetBanner("ok", "Bağlantı geri geldi, yükleniyor…"); boot(); });

boot();
</script>
